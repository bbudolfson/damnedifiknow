<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Hidden from search engines for now. Remove this line (and the X-Robots-Tag in netlify.toml) to make the site searchable. -->
<meta name="robots" content="noindex, nofollow">
<title>Damned If I Know</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Caveat:wght@500;600&family=Courier+Prime&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Damned If I Know</h1>
    <p class="by">The handwritten cookbook &amp; journal of Sudie Lea O’Connor, begun May 5, 1962</p>
    <p class="tally" id="tally"></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-book" data-view="book" aria-selected="true">The Book<span class="n" id="n-book"></span></button>
    <button role="tab" id="tab-journal" data-view="journal" aria-selected="false">Journal &amp; Menus<span class="n" id="n-journal"></span></button>
    <button role="tab" id="tab-review" data-view="review" aria-selected="false">Transcription Review<span class="n" id="n-review"></span></button>
  </nav>

  <main class="panel">
    <div class="controls" id="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search titles, ingredients, method, notes and stories" aria-label="Search the book" autocomplete="off">
      </div>
      <div class="filters" id="filters">
        <label for="f-cat">Category<select id="f-cat"></select></label>
        <label for="f-type">Type<select id="f-type"></select></label>
        <label for="f-src">Source<select id="f-src"></select></label>
        <label for="f-person">Person<select id="f-person"></select></label>
      </div>
      <div class="status">
        <span class="count" id="count"></span>
        <label class="check" for="f-flag"><input type="checkbox" id="f-flag"> Needs review only</label>
        <button type="button" id="clear">Clear filters</button>
      </div>
    </div>
    <div id="view"></div>
  </main>

  <footer>
    Words marked <span class="unc">like</span><span class="unc-q">?</span> were uncertain in the transcription. <span class="ed">[Bracketed text]</span> is an editorial note. Categories marked “corrected” were re-filed from the automatic sort; the original is kept in the data.
  </footer>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <article class="entry" id="entry" role="dialog" aria-modal="true" aria-labelledby="e-title"></article>
</div>

<script src="app.js"></script>
</body>
</html>
